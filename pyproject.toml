[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guru-sdk"
dynamic = ["version"]
description = "Modern Python SDK for the Guru API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Guru", email = "engineering@getguru.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.4",
]
codegen = [
    "datamodel-code-generator>=0.25",
]
publish = [
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/guruhq/guru-py-sdk"
Documentation = "https://github.com/guruhq/guru-py-sdk#readme"
Repository = "https://github.com/guruhq/guru-py-sdk"
Issues = "https://github.com/guruhq/guru-py-sdk/issues"

# =============================================================================
# Version — single source of truth in _version.py
# =============================================================================
[tool.hatch.version]
path = "src/guru_sdk/_version.py"

# =============================================================================
# Ruff — linting + formatting (replaces flake8 + isort + black)
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["guru_sdk"]

[tool.ruff.lint.per-file-ignores]
# Generated code uses camelCase field names from the API spec.
# GuruModel has populate_by_name=True so both camelCase and snake_case work.
"src/guru_sdk/models/_generated.py" = ["N815", "TCH003"]
# Manual models also need runtime imports for Pydantic field types (Team, User).
"src/guru_sdk/models/_manual.py" = ["TCH001"]

# =============================================================================
# Mypy — strict type checking
# =============================================================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

# =============================================================================
# Dependency Groups (PEP 735 — used by uv sync)
# =============================================================================
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "mypy>=1.10",
    "ruff>=0.4",
]
codegen = [
    "datamodel-code-generator>=0.25",
]
